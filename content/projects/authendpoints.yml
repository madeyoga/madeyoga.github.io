description:
  en: Ready-made auth endpoints on top of ASP.NET Core Identity. Registration, login, 2FA, password reset, and passkeys, mapped in minutes.
  id: Endpoint auth siap pakai di atas ASP.NET Core Identity. Registrasi, login, 2FA, reset password, dan passkeys, dipetakan dalam hitungan menit.

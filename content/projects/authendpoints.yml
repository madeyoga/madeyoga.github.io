problem:
  en: Building ASP.NET Core APIs usually means rewriting the same auth lifecycle every time — register, login, email confirmation, password reset, 2FA, and session management — with a different user model each project.
  id: Membangun API ASP.NET Core biasanya berarti menulis ulang siklus auth yang sama setiap kali — registrasi, login, konfirmasi email, reset password, 2FA, dan manajemen sesi — dengan model user yang berbeda di setiap proyek.
solution:
  en: AuthEndpoints packages that work into a composable library on top of ASP.NET Core Identity. Pick the modules you need, configure the token strategy, and map a secure auth layer in minutes instead of a week of copy-paste.
  id: AuthEndpoints mengemas pekerjaan itu menjadi pustaka composable di atas ASP.NET Core Identity. Pilih modul yang dibutuhkan, konfigurasikan strategi token, dan petakan lapisan auth yang aman dalam hitungan menit alih-alih seminggu copy-paste.
results:
  en: Released AuthEndpoints 3.0 RC with passkeys, opinionated hardening defaults, and public docs — turning auth setup from a project phase into a setup step for .NET developers.
  id: Merilis AuthEndpoints 3.0 RC dengan passkeys, default hardening yang opinionated, dan dokumentasi publik — mengubah setup auth dari fase proyek menjadi langkah setup bagi developer .NET.


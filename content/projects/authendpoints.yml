problem:
  en: Every ASP.NET Core API redoes the same auth. Register, login, email confirmation, password reset, 2FA, session management, each with a different user model.
  id: Setiap API ASP.NET Core mengulang auth yang sama. Registrasi, login, konfirmasi email, reset password, 2FA, manajemen sesi, dan model user yang berbeda-beda.
solution:
  en: AuthEndpoints turns that work into a composable library on top of ASP.NET Core Identity. Pick your modules, set the token strategy, and map a secure auth layer in minutes instead of a week of copy-paste.
  id: AuthEndpoints mengubahnya menjadi pustaka composable di atas ASP.NET Core Identity. Pilih modul, atur strategi token, dan petakan lapisan auth yang aman dalam hitungan menit, bukan seminggu copy-paste.
results:
  en: AuthEndpoints 3.0 ships with passkeys, hardened defaults, and public docs. Auth setup becomes a step, not a phase.
  id: AuthEndpoints 3.0 hadir dengan passkeys, default yang sudah diperkuat, dan dokumentasi publik. Setup auth jadi satu langkah, bukan satu fase.


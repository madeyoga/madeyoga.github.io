problem:
  en: The client needed a modern, professional online presence to showcase their security products and services. Their existing website was outdated and difficult to update.
  id: Klien membutuhkan kehadiran online yang modern dan profesional untuk memamerkan produk dan layanan keamanan mereka. Website lama mereka sudah ketinggalan zaman dan sulit diperbarui.
solution:
  en: Built a Nuxt-powered landing page with a Git-based CMS, allowing the team to easily update product listings and write blog posts using Markdown. Fully responsive design ensures great experience on all devices.
  id: Membangun landing page berbasis Nuxt dengan CMS berbasis Git, memungkinkan tim untuk dengan mudah memperbarui daftar produk dan menulis blog menggunakan Markdown. Desain responsif penuh memastikan pengalaman yang baik di semua perangkat.
results:
  en: Improved online visibility with SEO optimization. The client can now manage content independently without technical knowledge.
  id: Visibilitas online meningkat dengan optimasi SEO. Klien sekarang dapat mengelola konten secara mandiri tanpa pengetahuan teknis.


problem:
  en: The client's old site looked dated and was hard to update. They needed a way to show their security products and services online.
  id: Website lama klien kelihatan ketinggalan zaman dan sulit diperbarui. Mereka butuh cara untuk menampilkan produk dan layanan keamanan secara online.
solution:
  en: We rebuilt it on Nuxt with a Git-based CMS. Product listings and blog posts are plain Markdown now, so the team updates content without touching code.
  id: Kami membangun ulang situsnya dengan Nuxt dan CMS berbasis Git. Daftar produk dan postingan blog sekarang berupa Markdown biasa, jadi tim bisa update konten tanpa menyentuh kode.
results:
  en: Search visibility improved, and the client now manages the catalog and blog on their own.
  id: Visibilitas pencarian membaik, dan klien sekarang mengelola katalog serta blog sendiri.


problem:
  en: Small stores needed a POS they could afford and run without the internet. Existing options were either too complicated or needed a constant connection.
  id: Toko kecil butuh POS yang terjangkau dan bisa jalan tanpa internet. Pilihan yang ada terlalu ribet atau butuh koneksi terus-menerus.
solution:
  en: We built a Django POS that runs on the store's local network. Sales tracking, inventory with low-stock alerts, user roles, and printable receipts, all without the internet.
  id: Kami membangun POS Django yang berjalan di jaringan lokal toko. Pelacakan penjualan, inventaris dengan peringatan stok menipis, peran pengguna, dan struk cetak, semua tanpa internet.
results:
  en: The client dropped the monthly POS subscription and now owns their sales and inventory data. It handles hundreds of transactions a day.
  id: Klien berhenti bayar langganan POS bulanan dan sekarang punya kendali penuh atas data penjualan dan inventaris. Sistem ini menangani ratusan transaksi sehari.


problem:
  en: Small retail stores needed an affordable, offline-capable POS system that didn't rely on cloud services or expensive subscription fees. Existing solutions were either too complex or required constant internet connectivity.
  id: Toko ritel kecil membutuhkan sistem POS terjangkau yang bisa berjalan offline tanpa bergantung pada layanan cloud atau biaya berlangganan mahal. Solusi yang ada terlalu kompleks atau memerlukan koneksi internet konstan.
solution:
  en: Built a Django-based POS system that runs on the store's local network. Features include real-time sales tracking, inventory management with low-stock alerts, user role management, and printable receipts — all without internet dependency.
  id: Membangun sistem POS berbasis Django yang berjalan di jaringan lokal toko. Fitur termasuk pelacakan penjualan real-time, manajemen inventaris dengan peringatan stok rendah, manajemen peran pengguna, dan struk yang dapat dicetak — semuanya tanpa ketergantungan internet.
results:
  en: The client eliminated monthly POS subscription costs and gained full control over their sales and inventory data. The system handles hundreds of daily transactions reliably.
  id: Klien menghilangkan biaya berlangganan POS bulanan dan mendapatkan kontrol penuh atas data penjualan dan inventaris. Sistem menangani ratusan transaksi harian dengan andal.


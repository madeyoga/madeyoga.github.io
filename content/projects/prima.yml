problem:
  en: A growing pharmacy chain was doing accounting, inventory, and billing by hand across its branches. It was error-prone and didn't scale as they grew.
  id: Jaringan apotek yang berkembang masih mencatat akuntansi, inventaris, dan penagihan secara manual di tiap cabang. Rawan salah dan tidak ikut tumbuh saat cabang bertambah.
solution:
  en: We built an ASP.NET Core backend on Entity Framework Core and PostgreSQL. It handles accounting across branches, inventory with low-stock alerts, automatic billing, and access by role.
  id: Kami membangun backend ASP.NET Core dengan Entity Framework Core dan PostgreSQL. Ia menangani akuntansi antar-cabang, inventaris dengan peringatan stok menipis, penagihan otomatis, dan akses berdasarkan peran.
results:
  en: Every branch now shares one source of data. Errors dropped, inventory tracks itself, and there's room to add more branches.
  id: Semua cabang sekarang memakai satu sumber data. Kesalahan menurun, inventaris terpantau otomatis, dan masih ada ruang untuk menambah cabang.


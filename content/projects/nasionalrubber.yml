problem:
  en: The company sells to local and international buyers, so the site had to work in two languages. It also had to be simple to get around.
  id: Perusahaan ini jualan ke pembeli lokal dan luar negeri, jadi situsnya harus bisa dipakai dalam dua bahasa. Sekaligus harus gampang dinavigasi.
solution:
  en: We built it on Nuxt with i18n for English and Indonesian. The design is clean and focused on the company profile and products.
  id: Kami membangunnya dengan Nuxt dan i18n untuk Bahasa Inggris dan Bahasa Indonesia. Desainnya bersih dan fokus ke profil perusahaan serta produk.
results:
  en: One site now covers both markets through a language switch.
  id: Satu situs sekarang melayani dua pasar lewat tombol ganti bahasa.


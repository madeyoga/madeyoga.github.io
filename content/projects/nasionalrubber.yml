problem:
  en: A rubber industry company needed a corporate website with multilingual support to serve both Indonesian and international clients. The site needed to be simple, professional, and easy to navigate.
  id: Perusahaan industri karet membutuhkan website perusahaan dengan dukungan multi-bahasa untuk melayani klien Indonesia dan internasional. Situs harus sederhana, profesional, dan mudah dinavigasi.
solution:
  en: Developed a Nuxt-based landing page with built-in i18n support for English and Indonesian. Clean, responsive design focused on showcasing the company's profile and products.
  id: Mengembangkan landing page berbasis Nuxt dengan dukungan i18n untuk Bahasa Inggris dan Bahasa Indonesia. Desain bersih dan responsif fokus pada menampilkan profil perusahaan dan produk.
results:
  en: The bilingual site now serves both local and international clients effectively, with improved professional credibility.
  id: Situs bilingual sekarang melayani klien lokal dan internasional secara efektif, dengan kredibilitas profesional yang meningkat.


title:
  en: Services
  id: Layanan
description:
  en: I build software that solves real business problems.
  id: Saya membangun software yang menyelesaikan masalah bisnis yang nyata.

items:
  - icon: i-lucide-globe
    title:
      en: Need a site that ranks in Indonesia?
      id: Perlu situs yang tembus Google Indonesia?
    description:
      en: Fullstack sites and web apps on Nuxt, .NET, and Django.
      id: Situs dan aplikasi web fullstack di atas Nuxt, .NET, dan Django.
    deliverables:
      - en: Company profiles and landing pages
        id: Company profile dan landing page
      - en: Custom web applications (ERP, POS, inventory)
        id: Aplikasi web kustom (ERP, POS, inventaris)
      - en: Pages that load fast and rank on Google
        id: Halaman yang cepat dimuat dan muncul di Google

  - icon: i-lucide-settings
    title:
      en: Still running the toko, klinik, or gudang on spreadsheets?
      id: Toko, klinik, atau gudang masih jalan pakai spreadsheet?
    description:
      en: Business systems built around how you actually work, from accounting to inventory.
      id: Sistem bisnis yang dibangun mengikuti cara kerja Anda, dari akuntansi sampai inventaris.
    deliverables:
      - en: Business process automation
        id: Otomatisasi proses bisnis
      - en: Accounting and financial systems
        id: Sistem akuntansi dan keuangan
      - en: Inventory and stock management
        id: Manajemen inventaris dan stok

  - icon: i-lucide-palette
    title:
      en: Need a company profile that actually converts?
      id: Perlu company profile yang benar-benar convert?
    description:
      en: Landing pages built to convert, for a product, company, or campaign.
      id: Landing page yang dibuat untuk konversi, buat produk, perusahaan, atau campaign.
    deliverables:
      - en: Content and structure tuned for search
        id: Konten dan struktur yang dioptimalkan untuk pencarian
      - en: Fast, and works on phones
        id: Cepat dan nyaman di HP
      - en: Analytics and tracking wired in
        id: Analytics dan tracking terpasang

  - icon: i-lucide-lightbulb
    title:
      en: Want a straight answer before you build?
      id: Mau jawaban terang sebelum dibangun?
    description:
      en: Not sure about your tech stack, or want a second pair of eyes on your architecture? I'll tell you straight what I'd do.
      id: Bingung pilih tech stack, atau mau arsitektur dicek orang lain? Saya akan bilang terus terang apa yang akan saya lakukan.
    deliverables:
      - en: Tech stack advice and planning
        id: Konsultasi pemilihan tech stack
      - en: Code review and architecture audit
        id: Review kode dan audit arsitektur
      - en: Project scoping and estimation
        id: Scoping dan estimasi proyek

process:
  - step: 1
    icon: i-lucide-search
    title:
      en: Discovery
      id: Discovery
    description:
      en: We talk through what you need and what's in the way. I ask questions until I understand the business.
      id: Kita ngobrol soal kebutuhan dan kendala Anda. Saya bertanya sampai paham bisnisnya.
  - step: 2
    icon: i-lucide-pencil
    title:
      en: Plan
      id: Perencanaan
    description:
      en: I lay out a plan with milestones, the stack, and a timeline.
      id: Saya susun rencana dengan milestone, pilihan teknologi, dan timeline.
  - step: 3
    icon: i-lucide-code
    title:
      en: Build
      id: Pengembangan
    description:
      en: I build in small steps with regular check-ins, so you see progress and can redirect early.
      id: Saya bangun bertahap dengan update rutin, jadi Anda bisa lihat progres dan kasih masukan sejak awal.
  - step: 4
    icon: i-lucide-rocket
    title:
      en: Launch
      id: Peluncuran
    description:
      en: I handle deployment, testing, and go-live, plus docs and training if you need them.
      id: Saya urus deployment, testing, dan go-live, plus dokumentasi dan training kalau perlu.
  - step: 5
    icon: i-lucide-wrench
    title:
      en: Support
      id: Dukungan
    description:
      en: Support and maintenance after launch, so things keep working.
      id: Dukungan dan maintenance setelah launch, biar semuanya tetap jalan.

